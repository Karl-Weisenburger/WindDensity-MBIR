# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

# Install the package (CPU JAX) so autodoc can import it.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
